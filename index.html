<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de IMC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <h1>Sistema de IMC</h1>
        <p class="subtitulo">Cadastre uma pessoa e calcule seu IMC</p>

        <section class="formulario">
            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Digite o nome">
            </div>

            <div class="campo">
                <label for="peso">Peso (kg)</label>
                <input type="number" id="peso" placeholder="Ex: 70" step="0.1">
            </div>

            <div class="campo">
                <label for="altura">Altura (m)</label>
                <input type="number" id="altura" placeholder="Ex: 1.75" step="0.01">
            </div>

            <button id="btnAdicionar">Adicionar pessoa</button>
            <button id="btnLimpar" class="btn-secundario">Limpar campos</button>

            <p id="mensagem"></p>
        </section>

        <section class="pesquisa">
            <label for="pesquisaNome">Pesquisar por nome</label>
            <input type="text" id="pesquisaNome" placeholder="Digite um nome">
        </section>

        <section class="estatisticas">
            <div>
                <span>Total</span>
                <strong id="contador">0</strong>
            </div>

            <div>
                <span>Média dos IMCs</span>
                <strong id="media">0.00</strong>
            </div>

            <div>
                <span>Maior IMC</span>
                <strong id="maior">0.00</strong>
            </div>

            <div>
                <span>Menor IMC</span>
                <strong id="menor">0.00</strong>
            </div>
        </section>

        <div class="acoes">
            <button id="btnModo">Modo escuro</button>
        </div>

        <section>
            <h2>Pessoas cadastradas</h2>

            <div id="listaPessoas" class="lista"></div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
